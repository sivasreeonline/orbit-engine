name: CI

on:
  pull_request:
    branches: [main, "feat/**", "fix/**", "docs/**", "test/**"]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "docs/**"
      - "migrations/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "AGENTS.md"
      - "CLAUDE.md"
  push:
    branches: [main, "feat/**", "fix/**", "docs/**"]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "docs/**"
      - "migrations/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "AGENTS.md"
      - "CLAUDE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Web typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

  api:
    name: API typecheck, tests, migrations and dry-run deploy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sky_high_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sky_high_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # apps/api is still using exact direct dependency versions but does not
      # yet have its generated lockfile. Replace npm install with npm ci once
      # package-lock.json is generated and committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Set up Python for FENCE-001 witness profile conformance
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned FENCE-001 conformance dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1" "cryptography==46.0.3" "rfc8785==0.1.4"

      - name: Verify FENCE-001 witness profile schema and cryptographic vectors
        run: python ../../scripts/validate_m0_fence_witness_profile.py

      - name: Validate FENCE-001 external witness qualification record and fail-closed gates
        run: python ../../scripts/validate_m0_fence_witness_qualification.py

      - name: Verify FENCE-001 independently attested evidence manifest
        run: python ../../scripts/validate_m0_fence_evidence_manifest.py

      - name: Verify FENCE-001 materialized evidence artifact bytes
        run: python ../../scripts/verify_m0_fence_evidence_artifact_bytes.py

      - name: Verify FENCE-001 immutable evidence object-store contract
        run: python ../../scripts/validate_m0_fence_evidence_object_store.py

      - name: Verify FENCE-001 privileged retention-bypass and evidence-isolation contract
        run: python ../../scripts/validate_m0_fence_evidence_isolation.py

      - name: Verify guarded FENCE-001 provider privileged-bypass harness
        run: python ../../scripts/validate_m0_fence_provider_privileged_bypass.py --self-test

      - name: Verify RFC 9162 Merkle inclusion and consistency proof vectors
        run: python ../../scripts/validate_m0_fence_witness_merkle_proofs.py

      - name: Verify guarded FENCE-001 provider restore/recovery harness
        run: python ../../scripts/validate_m0_fence_provider_restore_recovery.py --self-test

      - name: Verify FENCE-001 provider audit provenance contract
        run: python ../../scripts/validate_m0_fence_provider_audit_provenance.py --self-test

      - name: Verify FENCE-001 audit provenance evidence-manifest binding
        run: python ../../scripts/validate_m0_fence_audit_provenance_manifest_binding.py --self-test

      - name: Verify FENCE-001 audit provenance binding generator
        run: python ../../scripts/create_m0_fence_audit_provenance_binding.py --self-test

      - name: Verify FENCE-001 end-to-end evidence custody gate
        run: python ../../scripts/validate_m0_fence_end_to_end_custody.py --self-test

      - name: Verify FENCE-001 external qualification orchestrator (synthetic only)
        run: python ../../scripts/validate_m0_fence_external_qualification.py --self-test

      - name: Verify FENCE-001 restore and witness reconciliation reference model
        run: python ../../scripts/validate_m0_witness_restore_reconciliation_model.py

      - name: Verify FENCE-001 independent monitor gossip reference model
        run: python ../../scripts/validate_m0_independent_monitor_gossip.py

      - name: Validate FENCE-001 monitor gossip envelope schema and semantic bindings
        run: python ../../scripts/validate_m0_fence_monitor_gossip_envelope.py

      - name: Verify FENCE-001 monitor gossip replay state machine
        run: python ../../scripts/validate_m0_monitor_gossip_replay_state.py

      - name: Verify FENCE-001 witness provider adapter conformance harness
        run: python ../../scripts/validate_m0_witness_provider_adapter_conformance.py

      - name: Configure PostgreSQL client wrappers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/postgres-client-bin"

          cat > "$RUNNER_TEMP/postgres-client-bin/psql" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          container_id="$(docker ps --filter "ancestor=postgres:17-alpine" --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          args=()
          input_file=""
          while (($#)); do
            if [[ "$1" == "-f" ]]; then
              if (($# < 2)); then echo "psql wrapper: -f requires a file path" >&2; exit 2; fi
              input_file="$2"
              args+=("-f" "-")
              shift 2
            else
              args+=("$1")
              shift
            fi
          done
          if [[ -n "$input_file" ]]; then
            test -f "$input_file"
            cat "$input_file" | docker exec -i -e "PGPASSWORD=${PGPASSWORD:-}" "$container_id" psql "${args[@]}"
          else
            exec docker exec -i -e "PGPASSWORD=${PGPASSWORD:-}" "$container_id" psql "${args[@]}"
          fi
          SH

          cat > "$RUNNER_TEMP/postgres-client-bin/pg_isready" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          container_id="$(docker ps --filter "ancestor=postgres:17-alpine" --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          exec docker exec -e "PGPASSWORD=${PGPASSWORD:-}" "$container_id" pg_isready "$@"
          SH

          chmod +x "$RUNNER_TEMP/postgres-client-bin/psql" "$RUNNER_TEMP/postgres-client-bin/pg_isready"
          echo "$RUNNER_TEMP/postgres-client-bin" >> "$GITHUB_PATH"

      - name: Apply problem catalog migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d sky_high_test -v ON_ERROR_STOP=1 -f migrations/0001_problem_catalog.sql

      - name: Seed and re-apply Two Sum migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d sky_high_test -v ON_ERROR_STOP=1 -f migrations/0002_seed_two_sum.sql
          psql -h 127.0.0.1 -U postgres -d sky_high_test -v ON_ERROR_STOP=1 -f migrations/0001_problem_catalog.sql
          psql -h 127.0.0.1 -U postgres -d sky_high_test -v ON_ERROR_STOP=1 -f migrations/0002_seed_two_sum.sql

      - name: Verify public fixtures and published immutability
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d sky_high_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $block$
          DECLARE
            version_id uuid := 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb1';
            public_count integer;
            hidden_count integer;
            blocked boolean := false;
          BEGIN
            SELECT count(*) INTO public_count
            FROM public_problem_test_cases
            WHERE problem_version_id = version_id;

            SELECT count(*) INTO hidden_count
            FROM problem_test_cases
            WHERE problem_version_id = version_id
              AND visibility = 'HIDDEN';

            IF public_count <> 2 OR hidden_count <> 2 THEN
              RAISE EXCEPTION 'Expected two public and two hidden fixtures; got public %, hidden %',
                public_count, hidden_count;
            END IF;

            BEGIN
              UPDATE problem_versions
              SET title = 'Mutation must be rejected'
              WHERE id = version_id;
            EXCEPTION WHEN SQLSTATE '55000' THEN
              blocked := true;
            END;

            IF NOT blocked THEN
              RAISE EXCEPTION 'Published problem version mutation was not rejected';
            END IF;

            blocked := false;
            BEGIN
              INSERT INTO problem_test_cases (
                problem_version_id, sequence, input_data, expected_output, visibility
              ) VALUES (
                version_id, 999, convert_to('1 2', 'UTF8'),
                convert_to('0 1', 'UTF8'), 'PUBLIC'
              );
            EXCEPTION WHEN SQLSTATE '55000' THEN
              blocked := true;
            END;

            IF NOT blocked THEN
              RAISE EXCEPTION 'Test fixture insertion into a published version was not rejected';
            END IF;
          END
          $block$;
          SQL

      - name: Worker deployment dry run
        run: npx wrangler deploy --dry-run

      - name: Dependency audit
        run: npm audit --audit-level=high
