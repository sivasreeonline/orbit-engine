name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "docs/**"
      - "migrations/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "AGENTS.md"
      - "CLAUDE.md"
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "AGENTS.md"
      - "CLAUDE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Let the full verification matrix finish; a newer commit must not abandon
  # required checks from an active run.
  cancel-in-progress: false

jobs:
  web:
    name: Web typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

  api:
    name: API typecheck, tests, migrations and dry-run deploy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sky_high_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sky_high_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: >-
          npm ci --no-audit --no-fund
          --fetch-retries=5
          --fetch-retry-mintimeout=10000
          --fetch-retry-maxtimeout=120000
          --fetch-timeout=300000

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The postgres:17-alpine service already contains psql and pg_isready.
      # Execute those clients inside the service container instead of installing
      # Ubuntu packages on the runner; CI must not depend on apt repository DNS.
      - name: Configure PostgreSQL client wrappers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/postgres-client-bin"

          cat > "$RUNNER_TEMP/postgres-client-bin/psql" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          container_id="$(docker ps --filter "ancestor=postgres:17-alpine" --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"

          args=()
          input_file=""
          while (($#)); do
            if [[ "$1" == "-f" ]]; then
              if (($# < 2)); then
                echo "psql wrapper: -f requires a file path" >&2
                exit 2
              fi
              input_file="$2"
              args+=("-f" "-")
              shift 2
            else
              args+=("$1")
              shift
            fi
          done

          if [[ -n "$input_file" ]]; then
            test -f "$input_file"
            cat "$input_file" | docker exec -i -e "PGPASSWORD=${PGPASSWORD:-}" "$container_id" psql "${args[@]}"
          else
            exec docker exec -i -e "PGPASSWORD=${PGPASSWORD:-}" "$container_id" psql "${args[@]}"
          fi
          SH

          cat > "$RUNNER_TEMP/postgres-client-bin/pg_isready" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          container_id="$(docker ps --filter "ancestor=postgres:17-alpine" --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          exec docker exec -e "PGPASSWORD=${PGPASSWORD:-}" "$container_id" pg_isready "$@"
          SH

          chmod +x "$RUNNER_TEMP/postgres-client-bin/psql" "$RUNNER_TEMP/postgres-client-bin/pg_isready"
          echo "$RUNNER_TEMP/postgres-client-bin" >> "$GITHUB_PATH"

      - name: Apply problem catalog migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d sky_high_test -v ON_ERROR_STOP=1 -f migrations/0001_problem_catalog.sql

      - name: Seed and re-apply Two Sum migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d sky_high_test -v ON_ERROR_STOP=1 -f migrations/0002_seed_two_sum.sql
          psql -h 127.0.0.1 -U postgres -d sky_high_test -v ON_ERROR_STOP=1 -f migrations/0001_problem_catalog.sql
          psql -h 127.0.0.1 -U postgres -d sky_high_test -v ON_ERROR_STOP=1 -f migrations/0002_seed_two_sum.sql

      - name: Verify public fixtures and published immutability
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d sky_high_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $block$
          DECLARE
            version_id uuid := 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb1';
            public_count integer;
            hidden_count integer;
            blocked boolean := false;
          BEGIN
            SELECT count(*) INTO public_count
            FROM public_problem_test_cases
            WHERE problem_version_id = version_id;

            SELECT count(*) INTO hidden_count
            FROM problem_test_cases
            WHERE problem_version_id = version_id
              AND visibility = 'HIDDEN';

            IF public_count <> 2 OR hidden_count <> 2 THEN
              RAISE EXCEPTION 'Expected two public and two hidden fixtures; got public %, hidden %',
                public_count, hidden_count;
            END IF;

            BEGIN
              UPDATE problem_versions
              SET title = 'Mutation must be rejected'
              WHERE id = version_id;
            EXCEPTION WHEN SQLSTATE '55000' THEN
              blocked := true;
            END;

            IF NOT blocked THEN
              RAISE EXCEPTION 'Published problem version mutation was not rejected';
            END IF;

            blocked := false;
            BEGIN
              INSERT INTO problem_test_cases (
                problem_version_id, sequence, input_data, expected_output, visibility
              ) VALUES (
                version_id, 999, convert_to('1 2', 'UTF8'),
                convert_to('0 1', 'UTF8'), 'PUBLIC'
              );
            EXCEPTION WHEN SQLSTATE '55000' THEN
              blocked := true;
            END;

            IF NOT blocked THEN
              RAISE EXCEPTION 'Test fixture insertion into a published version was not rejected';
            END IF;
          END
          $block$;
          SQL

      - name: Apply and re-apply proposed execution intake migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d sky_high_test -v ON_ERROR_STOP=1 -f migrations/0003_execution_intake_foundation.sql
          psql -h 127.0.0.1 -U postgres -d sky_high_test -v ON_ERROR_STOP=1 -f migrations/0003_execution_intake_foundation.sql

      - name: Verify execution intake persistence invariants
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d sky_high_test -v ON_ERROR_STOP=1 -f migrations/tests/0003_execution_intake_foundation.sql

      - name: Verify concurrent execution intake against PostgreSQL
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sky_high_test
        run: npx vitest run src/db/execution-intake-repository.integration.test.ts

      - name: Verify outbox leases against PostgreSQL
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sky_high_test
        run: npx vitest run src/db/outbox-lease-repository.integration.test.ts

      - name: Verify execution job claims against PostgreSQL
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sky_high_test
        run: npx vitest run src/db/execution-job-repository.integration.test.ts

      - name: Verify authorization ledger transactions against disposable PostgreSQL schema
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sky_high_test
        run: npx vitest run src/db/authorization-ledger.integration.test.ts

      - name: Verify disposable FENCE-001 authority storage prototype
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d sky_high_test -v ON_ERROR_STOP=1 \
            -f ../../migrations/tests/m0_fence_authority_disposable_prototype.sql

      - name: Verify PostgreSQL crash recovery after committed and uncommitted writes
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter "ancestor=postgres:17-alpine" --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"

          transaction_pid=""
          restart_if_needed() {
            if [ -n "$transaction_pid" ]; then
              kill "$transaction_pid" 2>/dev/null || true
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$container_id" 2>/dev/null || true)" != "true" ]; then
              docker start "$container_id" >/dev/null 2>&1 || true
            fi
          }
          trap restart_if_needed EXIT

          psql -h 127.0.0.1 -U postgres -d sky_high_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS crash_recovery_it;
          DROP TABLE IF EXISTS crash_recovery_it.recovery_probe;
          CREATE TABLE crash_recovery_it.recovery_probe (
            probe_id text PRIMARY KEY,
            payload text NOT NULL
          );
          CHECKPOINT;
          INSERT INTO crash_recovery_it.recovery_probe (probe_id, payload)
          VALUES ('committed-before-crash', 'must-survive-wal-recovery');
          SQL

          psql -h 127.0.0.1 -U postgres -d sky_high_test -v ON_ERROR_STOP=1 \
            -c "BEGIN; INSERT INTO crash_recovery_it.recovery_probe VALUES ('uncommitted-before-crash', 'must-be-rolled-back'); SELECT pg_sleep(60); COMMIT;" \
            >/tmp/orbit-pg-uncommitted-transaction.log 2>&1 &
          transaction_pid=$!

          active_transaction=0
          for attempt in $(seq 1 30); do
            active_transaction="$(psql -h 127.0.0.1 -U postgres -d sky_high_test -Atqc \
              "SELECT count(*) FROM pg_stat_activity WHERE state = 'active' AND query LIKE '%pg_sleep(60)%'")"
            if [ "$active_transaction" -ge 1 ]; then
              break
            fi
            sleep 1
          done
          test "$active_transaction" -ge 1

          docker kill --signal KILL "$container_id" >/dev/null
          wait "$transaction_pid" 2>/dev/null || true
          transaction_pid=""
          docker start "$container_id" >/dev/null

          ready=0
          for attempt in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres -d sky_high_test; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

          psql -h 127.0.0.1 -U postgres -d sky_high_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $block$
          DECLARE committed_count integer; uncommitted_count integer;
          BEGIN
            SELECT count(*) INTO committed_count
              FROM crash_recovery_it.recovery_probe
              WHERE probe_id = 'committed-before-crash'
                AND payload = 'must-survive-wal-recovery';
            SELECT count(*) INTO uncommitted_count
              FROM crash_recovery_it.recovery_probe
              WHERE probe_id = 'uncommitted-before-crash';
            IF committed_count <> 1 OR uncommitted_count <> 0 THEN
              RAISE EXCEPTION 'Crash recovery mismatch: committed %, uncommitted %',
                committed_count, uncommitted_count;
            END IF;
          END
          $block$;
          SQL
          trap - EXIT

      - name: Worker deployment dry run
        run: npx wrangler deploy --dry-run

      - name: Dependency audit
        run: npm audit --audit-level=high

  ci-gate:
    name: Require web and API CI jobs to pass
    runs-on: ubuntu-latest
    needs: [web, api]
    if: always()
    steps:
      - name: Enforce required job results
        env:
          WEB_RESULT: ${{ needs.web.result }}
          API_RESULT: ${{ needs.api.result }}
        run: |
          printf 'Web CI result: %s\n' "$WEB_RESULT"
          printf 'API CI result: %s\n' "$API_RESULT"
          test "$WEB_RESULT" = "success"
          test "$API_RESULT" = "success"

