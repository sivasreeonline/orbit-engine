name: Go Runner CI

on:
  pull_request:
    paths:
      - "services/execution-runner/**"
      - ".github/workflows/go-runner-ci.yml"
  push:
    branches:
      - "feat/**"
      - "fix/**"
    paths:
      - "services/execution-runner/**"
      - ".github/workflows/go-runner-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-runner-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  go-runner:
    name: Go formatting, vet, unit and race tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/execution-runner
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/execution-runner/go.mod
          cache: false

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Files require gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Race tests
        run: go test -race ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Vulnerability scan
        run: "$(go env GOPATH)/bin/govulncheck" ./...
