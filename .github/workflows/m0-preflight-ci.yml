name: M0 Host Preflight Harness

on:
  push:
    branches: ["feat/**", "docs/**"]
    paths:
      - "services/execution-runner/scripts/m0-host-preflight.sh"
      - "services/execution-runner/README.md"
      - "docs/specifications/m0-host-preflight-and-proof-runbook.md"
      - "docs/specifications/m0-proof-resource-profile-v1.md"
      - "docs/specifications/m0-adversarial-fixture-contract.md"
      - "docs/specifications/m0-runtime-proof-harness-design.md"
      - "docs/specifications/m0-execution-proof.md"
      - "docs/adr/ADR-0019-m0-host-launch-boundary.md"
      - "docs/security/m0-sandbox-security-review-packet.md"
      - ".github/workflows/m0-preflight-ci.yml"
      - "docs/schemas/m0-proof-evidence.schema.json"
      - "scripts/validate_m0_evidence_schema.py"
      - "scripts/validate_m0_cleanup_gate.py"
      - "docs/schemas/m0-cleanup-calibration-authorization.schema.json"
      - "scripts/validate_m0_cleanup_calibration_authorization.py"
      - "docs/specifications/m0-authorization-lifecycle-and-recovery-contract.md"
      - "docs/specifications/m0-authorization-ledger-data-model.md"
      - "docs/specifications/m0-cryptographic-trust-and-key-lifecycle.md"
      - "scripts/validate_m0_authorization_lifecycle_contract.py"
      - "docs/schemas/m0-ledger-anti-rollback-checkpoint.schema.json"
      - "docs/schemas/m0-immutable-evidence-object-receipt.schema.json"
      - "scripts/validate_m0_witness_evidence_contract.py"
      - "docs/specifications/m0-authorization-transaction-enforcement-proposal.md"
      - "scripts/validate_m0_authorization_transaction_contract.py"
      - "docs/schemas/m0-authorization-transaction-fixture-catalog.json"
      - "docs/schemas/m0-crypto-signed-envelope.schema.json"
      - "docs/schemas/m0-crypto-trust-bundle.schema.json"
      - "docs/schemas/m0-crypto-key-metadata.schema.json"
      - "docs/schemas/m0-crypto-verification-report.schema.json"
      - "docs/schemas/m0-crypto-key-lifecycle-event.schema.json"
      - "docs/schemas/m0-checkpoint-custody-review-attestation-payload.schema.json"
      - "docs/schemas/m0-crypto-key-lifecycle-event.schema.json"
      - "docs/schemas/m0-host-epoch-response-payload.schema.json"
      - "docs/schemas/m0-provider-fence-attestation-payload.schema.json"
      - "docs/schemas/m0-predecessor-fence-bundle.schema.json"
      - "docs/specifications/m0-fence-001-predecessor-evidence-contract.md"
      - "scripts/validate_m0_predecessor_fence_bundle.py"
      - "scripts/validate_m0_fence_epoch_response_binding.py"
      - "scripts/validate_m0_fence_authority_conformance.py"
      - "scripts/validate_m0_fence_durable_authority_recovery.py"
      - "docs/specifications/m0-fence-001-authority-conformance-model.md"
      - "docs/specifications/m0-fence-001-durable-authority-storage-recovery-proposal.md"
      - "docs/schemas/m0-phase-a-authorization-payload.schema.json"
      - "docs/schemas/m0-key-revocation-payload.schema.json"
      - "docs/schemas/m0-crypto-verification-fixture-catalog.json"
      - "scripts/validate_m0_crypto_contract.py"
      - "docs/specifications/m0-supervisor-journal-implementation-contract.md"
      - "docs/specifications/m0-journal-backend-evaluation.md"
      - "scripts/validate_m0_supervisor_journal_contract.py"
      - "docs/security/m0-independent-security-review-checklist.md"
      - "docs/security/m0-independent-security-review-record.schema.json"
      - "docs/security/m0-independent-security-review-record.template.json"
      - "scripts/validate_m0_independent_review_package.py"
      - "docs/specifications/m0-host-and-journal-qualification-protocol.md"
      - "docs/schemas/m0-host-qualification-record.schema.json"
      - "docs/schemas/m0-host-qualification-record.template.json"
      - "scripts/validate_m0_host_qualification.py"
      - "docs/adr/ADR-0019-decision-dossier.md"
      - "docs/adr/ADR-0019-upstream-compatibility-evidence.md"
      - "docs/adr/ADR-0019-upstream-source-manifest.json"
      - "docs/schemas/ADR-0019-upstream-source-manifest.schema.json"
      - "scripts/validate_m0_upstream_source_manifest.py"
      - "docs/schemas/m0-adr-0019-decision-record.schema.json"
      - "docs/schemas/m0-adr-0019-decision-record.template.json"
      - "scripts/validate_m0_adr_0019_decision.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-validation:
    name: Validate read-only preflight script
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Bash syntax
        run: bash -n services/execution-runner/scripts/m0-host-preflight.sh

      - name: Set up Python for evidence schema checks
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 30 "jsonschema==4.25.1"

      - name: Validate evidence schema and fail-closed invariants
        run: python scripts/validate_m0_evidence_schema.py

      - name: Validate cleanup calibration and full-proof gates
        run: python scripts/validate_m0_cleanup_gate.py

      - name: Validate cleanup calibration authorization contract
        run: python scripts/validate_m0_cleanup_calibration_authorization.py

      - name: Validate authorization lifecycle contract linkage
        run: python scripts/validate_m0_authorization_lifecycle_contract.py

      - name: Validate external witness and immutable evidence contracts
        run: python scripts/validate_m0_witness_evidence_contract.py

      - name: Validate authorization transaction and race contracts
        run: python scripts/validate_m0_authorization_transaction_contract.py

      - name: Validate M0 cryptographic schemas and structural fixtures
        run: python scripts/validate_m0_crypto_contract.py

      - name: Validate FENCE-001 complete predecessor evidence bundle
        run: python scripts/validate_m0_predecessor_fence_bundle.py

      - name: Validate FENCE-001 epoch response and bundle cross-binding
        run: python scripts/validate_m0_fence_epoch_response_binding.py

      - name: Validate FENCE-001 authority state-machine conformance model
        run: python scripts/validate_m0_fence_authority_conformance.py

      - name: Validate FENCE-001 durable authority crash recovery model
        run: python scripts/validate_m0_fence_durable_authority_recovery.py

      - name: Validate supervisor, journal and watchdog contract alignment
        run: python scripts/validate_m0_supervisor_journal_contract.py

      - name: Validate independent security review package
        run: python scripts/validate_m0_independent_review_package.py

      - name: Validate host and journal qualification protocol
        run: python scripts/validate_m0_host_qualification.py

      - name: Validate immutable upstream source manifest
        run: python scripts/validate_m0_upstream_source_manifest.py

      - name: Validate ADR-0019 architecture decision dossier
        run: python scripts/validate_m0_adr_0019_decision.py

      - name: Verify script is not configured to launch workloads
        shell: bash
        run: |
          if grep -En '^[[:space:]]*(sudo|apt(-get)?|systemctl|docker|ctr|nerdctl|podman)[[:space:]]+(run|install|start|stop|pull|create|exec)([[:space:]]|$)' services/execution-runner/scripts/m0-host-preflight.sh; then
            echo "Preflight script must remain read-only."
            exit 1
          fi
