product:
  name: Sky High Coding Judge
  scope: B - Intelligent Coding Judge
  execution_strategy: hybrid
  judge0: prohibited
  initial_problem_contract: console-stdin-stdout
  authoritative_verdicts: deterministic
  ai_feedback: advisory-only

stack:
  frontend: Vite + React + TypeScript
  frontend_hosting: Cloudflare Pages
  api_control_plane: Cloudflare Workers
  coordination: Cloudflare Durable Objects
  database: Neon PostgreSQL
  object_storage: Cloudflare R2
  async_queue: Cloudflare Queues
  runner_language: Go
  runner_host: separately-hosted Linux
  sandbox_candidate: gVisor runsc with OCI runtime
  languages:
    - Java 25
    - Python 3.14

architecture:
  application_style: modular-monolith
  execution_boundary: isolated-linux-runner
  queue_delivery: at-least-once
  queue_safety: transactional-outbox-and-idempotent-consumer
  attempt_history: immutable
  hidden_tests: server-side-only
  runtime_versions: pinned
  images: immutable-digests

milestones:
  M0: secure-execution-proof
  M1: core-coding-judge
  parallelism: M1-mock-adapter-development-while-M0-validates-runner

open_decisions:
  - linux-host-provider-and-architecture
  - OCI-engine-selection
  - gVisor-kernel-compatibility-and-overhead
  - Neon-connectivity-from-runner
  - queue-pull-consumer-authentication
  - Durable-Object-live-status-need
  - function-style-problem-support-after-pilot-review
  - assessment-concurrency-and-capacity-targets
  - retention-and-privacy-policy
